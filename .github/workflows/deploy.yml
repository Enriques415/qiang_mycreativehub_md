name: Legacy GitHub Pages (手动发布备用)

# ⚠️ 线上部署路径只有一条：push 到 main → Cloudflare Pages 自动构建部署。
# （Cloudflare Pages 项目的 Git 集成：构建命令 `npm run build`，输出目录 `dist/client`）
#
# 这个 workflow 是旧的 GitHub Pages 路径。原先它在 push 到 main 时也会自动跑一遍，
# 于是每次推代码会同时触发两次部署（GitHub Pages + Cloudflare Pages），
# 两个站点的内容可能不同步，还会在搜索引擎眼里变成重复内容。
#
# 现在改成**只能手动触发**：Actions 页面 → Run workflow。
# 需要临时往 GitHub Pages 发一版时再用它。

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # 注意：不要再用 `cp dist/client/index.html dist/client/404.html` 做 SPA fallback。
      # 那样未知路径会拿到一份首页 HTML —— 即使状态码是 404，搜索引擎仍会判定为
      # 「重复内容 / 软 404」，白白稀释首页权重。
      # public/404.html 已经是真正的 404 页，Vite 构建时会原样复制到 dist/client/。

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4